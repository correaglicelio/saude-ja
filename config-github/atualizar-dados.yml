# Saúde Já: atualiza TODOS os dados toda segunda-feira e publica o site no GitHub Pages.
# Custo: zero (GitHub Actions e Pages são gratuitos para repositórios públicos).
# Para rodar na hora: aba Actions > "Atualizar dados e publicar" > Run workflow.
name: Atualizar dados e publicar

on:
  schedule:
    - cron: "17 9 * * 1"   # segunda-feira, 06:17 em Brasília (o arquivo novo de SRAG sai na madrugada de segunda)
  workflow_dispatch:        # botão "Run workflow"
  push:
    branches: [main]        # quando você envia mudanças pelo GitHub Desktop, só republica o site

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  coletar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    concurrency:            # uma coleta por vez; não trava a publicação de mudanças do site
      group: coleta
      cancel-in-progress: false
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cada coleta é independente: se uma falhar (site do governo fora do ar, por exemplo),
      # as outras continuam e o que deu certo é salvo. O resumo no fim mostra o que falhou.
      - name: Unidades de saúde, leitos e população (CNES, IBGE)
        id: cnes
        run: python scripts/coletar_cnes.py
        continue-on-error: true
        timeout-minutes: 60
      - name: Qualidade da água (SISAGUA)
        id: agua
        run: python scripts/coletar_agua.py
        continue-on-error: true
        timeout-minutes: 60
      - name: Remédios (Farmácia Popular, estoque e preços)
        id: remedios
        run: python scripts/coletar_remedios.py
        continue-on-error: true
        timeout-minutes: 60
      - name: Doação de sangue (CNES)
        id: sangue
        run: python scripts/coletar_sangue.py
        continue-on-error: true
        timeout-minutes: 30
      - name: Dengue, chikungunya e zika (InfoDengue)
        id: dengue
        run: python scripts/coletar_arboviroses.py --uf MT   # troque por --uf todas para o Brasil inteiro
        continue-on-error: true
        timeout-minutes: 60
      - name: Gripe, covid e VSR (SRAG, SIVEP-Gripe)
        id: srag
        run: python scripts/coletar_srag.py --uf MT          # troque por --uf todas para o Brasil inteiro
        continue-on-error: true
        timeout-minutes: 60
      - name: Gastos com saúde (SIOPS) e Previne Brasil
        id: transparencia
        run: python scripts/coletar_transparencia.py --uf MT # troque por --uf todas para o Brasil inteiro
        continue-on-error: true
        timeout-minutes: 60
      - name: Vacinas aplicadas (SI-PNI, meses novos; 1,5 a 4 GB lidos sem gravar)
        id: vacinas
        run: python scripts/coletar_vacinacao.py --sem-populacao
        continue-on-error: true
        timeout-minutes: 180

      - name: Resumo da coleta
        if: always()
        run: |
          {
            echo "## Coleta de $(date -u +%d/%m/%Y)"
            echo "| Dados | Resultado |"
            echo "|---|---|"
            echo "| Unidades, leitos e população | ${{ steps.cnes.outcome }} |"
            echo "| Água | ${{ steps.agua.outcome }} |"
            echo "| Remédios | ${{ steps.remedios.outcome }} |"
            echo "| Doação de sangue | ${{ steps.sangue.outcome }} |"
            echo "| Dengue | ${{ steps.dengue.outcome }} |"
            echo "| Gripe e covid (SRAG) | ${{ steps.srag.outcome }} |"
            echo "| Transparência | ${{ steps.transparencia.outcome }} |"
            echo "| Vacinas | ${{ steps.vacinas.outcome }} |"
            echo ""
            echo "success = atualizado · failure = falhou (ficam os dados da semana anterior)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar dados no repositório
        run: |
          git config user.name "saude-ja-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data dados
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Dados atualizados em $(date -u +%d/%m/%Y)"
          git pull --rebase --strategy-option=theirs origin main || true
          git push

  publicar:
    needs: [coletar]
    if: always() && (needs.coletar.result == 'success' || needs.coletar.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
