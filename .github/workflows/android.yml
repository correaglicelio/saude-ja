# Compila o app Android (android/) para conferir que o projeto está certo e gera um APK de teste.
# O APK oficial, assinado com a sua chave, é gerado no Android Studio.
name: App Android (teste)

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compilar APK de teste
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: saude-ja-apk-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk
