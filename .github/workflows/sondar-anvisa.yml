name: Sondar Anvisa (teste)
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'P'
          import urllib.request, re
          u="https://news.google.com/rss/search?q=site:gov.br/anvisa&hl=pt-BR&gl=BR&ceid=BR:pt-419"
          x=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"}),timeout=40).read().decode()
          for it in re.findall(r"<item>(.*?)</item>",x,re.S)[:8]:
              print("ITEM", re.findall(r"<title>(.*?)</title>",it)[:1], re.findall(r"<pubDate>(.*?)</pubDate>",it), re.findall(r"<link>(.*?)</link>",it), re.findall(r"<source[^>]*>(.*?)</source>",it))
          P
