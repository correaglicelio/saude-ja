name: Sondar Anvisa (teste)
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U='https://www.gov.br/anvisa/++api++/pt-br/@search?portal_type=News%20Item&sort_on=effective&sort_order=reverse&b_size=3&metadata_fields=effective'
          B='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          t(){ echo "--- $1"; shift; curl -s -m 40 -o /tmp/o -w "%{http_code} %{size_download}\n" "$@" || true; head -c 200 /tmp/o 2>/dev/null || true; echo; }
          t "gov.br saude" -A "$B" "https://www.gov.br/saude/pt-br"
          t "gov.br raiz" -A "$B" "https://www.gov.br/"
          t "anvisa dominio antigo" -A "$B" "https://www.anvisa.gov.br/"
          t "gnews rss" -A "$B" "https://news.google.com/rss/search?q=site:gov.br/anvisa&hl=pt-BR&gl=BR&ceid=BR:pt-419"
          t "bing rss" -A "$B" "https://www.bing.com/news/search?q=site%3Agov.br%2Fanvisa&format=rss"
